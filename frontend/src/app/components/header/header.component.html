<header class="header">
  <div class="header__container">
    <a class="header__logo" [routerLink]="['/']">
      <svg width="30" height="33" viewBox="0 0 42 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M38.9711 11.25L19.4856 0L0 11.25V33.75L38.9711 11.25Z" fill="#EC5EB7" />
        <path d="M2.9854 34.5L22.471 45.75L41.9565 34.5L41.9565 12L2.9854 34.5Z" fill="#B783EB" />
      </svg>
      <span>Crypto Portfolio Tracker</span>
    </a>
    <nav class="header__nav nav-header">
      @if (authService.me) {
        <a [routerLink]="ROUTES.portfoliosList" class="nav-header__link link">
          Portfolios
        </a>
        <div class="nav-header__user user-nav">
          <button
            id="modal-target-header"
            type="button"
            class="user-nav__avatar"
            (click)="this.modalAdapter.open('header')"
          >
            <img src="https://s3.coinmarketcap.com/static/img/portraits/63351fb59b613d345489037c.png" alt="avatar"
                 srcset="https://s3.coinmarketcap.com/static/img/portraits/63351fb59b613d345489037c.png">
          </button>
          <app-modal
            class="user-nav__modal modal-nav"
            [modalId]="'header'"
            [options]="{
              closeOutside: true
            }"
          >
            <div class="modal-nav__user modal-user">
              <div class="modal-user__avatar">
                <img src="https://s3.coinmarketcap.com/static/img/portraits/63351fb59b613d345489037c.png"
                     alt="avatar-dropdown"
                     srcset="https://s3.coinmarketcap.com/static/img/portraits/63351fb59b613d345489037c.png">
              </div>
              <div class="modal-user__content">
                <h1 class="modal-user__name">{{ authService.me.username }}</h1>
                <h1 class="modal-user__email">{{ authService.me.email }}</h1>
              </div>
            </div>
            <ul class="modal-nav__list">
              <button
                class="modal-nav__item"
                type="button"
                (click)="this.authService.logout().subscribe()"
              >
                Log Out
              </button>
            </ul>
          </app-modal>
        </div>
      } @else {
        <a class="nav-header__link button" [routerLink]="['/' + ROUTES.login]">
          Login
        </a>
      }
    </nav>
  </div>
</header>
